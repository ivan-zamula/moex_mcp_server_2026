[project]
name = "moex-mcp-server-2026"
version = "0.1.0"
description = "MCP-сервер на Python для получения котировок Московской биржи"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
